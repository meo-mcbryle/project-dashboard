<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Project Dashboard</h1>
        <button id="auth-btn" onclick="handleAuthClick()">Admin Login</button>
    </div>

    <div id="admin-panel">
        <div class="admin-controls">
            <span style="font-weight: 600; font-size: 0.875rem;">Admin Session</span>
            <button onclick="addNewProject()" style="background: #10b981; color: white; border: none; font-weight: 600;">+ New Project</button>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="year-buttons" class="year-selector">
        </div>

    <div id="content-area">
        <div class="header">
            <h2 id="current-year-label">Loading...</h2>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search by title..." oninput="handleSearch(this.value)">
            </div>
        </div>
        <div class="table-container">
            <table id="project-table">
                <thead>
                    <tr>
                        <th class="sortable" onclick="handleSort('title')">Title ↕</th>
                        <th class="sortable" onclick="handleSort('location')">Location ↕</th>
                        <th class="sortable" onclick="handleSort('status')">Status ↕</th>
                        <th>File Link</th>
                        <th class="admin-only" style="display:none;">Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- File Modal -->
<div id="file-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modal-project-title">Project Files</h3>
            <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>
        <div id="modal-file-list" class="file-list"></div>
        <div id="modal-admin-section" style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); display: none;">
            <label style="display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;">Upload New Attachment</label>
            <input type="file" id="modal-file-upload" onchange="handleModalUpload(event)" style="font-size: 0.875rem;">
        </div>
    </div>
</div>

    <script src="script.js"></script>

</body>
</html>
