<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Project Dashboard</h1>
        <button id="auth-btn" onclick="handleAuthClick()">Admin Login</button>
    </div>

    <div id="admin-panel">
        <div class="admin-controls">
            <strong>Admin Mode:</strong>
            <button onclick="addNewProject()" style="background: #059669; color: white; border: none;">+ Add Project</button>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="year-buttons" class="year-selector">
        </div>

    <div id="content-area">
        <div class="header">
            <h2 id="current-year-label">Loading...</h2>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search by title..." oninput="handleSearch(this.value)">
            </div>
        </div>
        <table id="project-table">
            <thead>
                <tr>
                    <th class="sortable" onclick="handleSort('title')">Title ↕</th>
                    <th class="sortable" onclick="handleSort('location')">Location ↕</th>
                    <th>Status</th>
                    <th>File Link</th>
                    <th class="admin-only" style="display:none;">Actions</th>
                </tr>
            </thead>
            <tbody id="table-body">
                </tbody>
        </table>
    </div>
</div>

    <script src="script.js"></script>

</body>
</html>
